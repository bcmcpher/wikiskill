# Capability suite for one unit: data-science-harness's gen-data-dict skill (curate plugin).
#
#     wikiskill suite check pilots/gen-data-dict/suite.yaml
#     wikiskill eval --suite pilots/gen-data-dict/suite.yaml --collection dsh-curate \
#       --base-url http://localhost:11434/v1 \
#       --models ollama/gemma4:latest ollama/qwen3:30b-a3b --condition off,injected
#
# The skill's rule is that a data dictionary's structure comes from the data and its meaning only
# from the user or a codebook: a column nobody explained gets no entry and is named in the reply,
# a unit or level coding is never assumed, an existing description is never overwritten, and the
# table is never edited. Verifiers check those against participants.json and the repository; a
# judge (`rubric.yaml`, `[roles.judge]` in dsh-curate.toml) scores what they cannot: whether every
# entry is sourced, whether the reply names every gap, and whether descriptions say anything.
#
# Runs are headless, so no one answers the skill's questions. Every meaning a task means to supply
# is in a codebook file or the prompt; anything else is meant to stay undescribed. The codings
# deliberately differ from the common ones (age in months, `1 = female`), so a recalled convention
# shows up as a wrong value rather than a lucky guess.
#
# DataLad is not installed, so the skill's `datalad save` fails; no verifier depends on a commit.
# Prompts never name the skill.

suite: gen-data-dict
description: Does gen-data-dict write only the entries it can source, and say what it left out?

defaults:
  repeats: 3
  timeout_s: 600
  max_steps: 30
  requires: [git, python3]
  env:
    GIT_AUTHOR_NAME: Pilot
    GIT_AUTHOR_EMAIL: pilot@example.org
    GIT_COMMITTER_NAME: Pilot
    GIT_COMMITTER_EMAIL: pilot@example.org
  guard:
    deny:
      - "*git push*"
      - "*curl*"
      - "*wget *"
      - "*pip install*"

tasks:
  - id: partial-codebook
    prompt: >
      Generate the data dictionary for participants.tsv. Our codebook is in codebook.md.
    split: val
    expect: { skill: gen-data-dict }
    rubric: rubric.yaml
    setup:
      - git init -q -b main .
      - 'printf ''participant_id\tage\tsex\tgrp\tmoca\thand\nsub-01\t412\t1\thc\t28\tR\nsub-02\t530\t2\tpd\t22\tL\nsub-03\t388\t1\tpdd\t17\tR\nsub-04\t455\t2\thc\t27\tR\n'' > participants.tsv'
      - 'printf ''# Codebook (clinic database export, v2)\n\n- age: age at the baseline visit, in months\n- sex: 1 = female, 2 = male\n- grp: hc = healthy control, pd = Parkinson disease\n- moca: Montreal Cognitive Assessment total score, 0 to 30 points\n'' > codebook.md'
      - git add -A && git commit -q -m "add table and codebook"
    verifiers:
      - kind: command
        run: |
          python3 - <<'PY'
          import json, sys
          d = json.load(open("participants.json"))
          lv = {k: str(v).lower() for k, v in (d.get("sex", {}).get("Levels") or {}).items()}
          problems = []
          if "month" not in str(d.get("age", {}).get("Units", "")).lower():
              problems.append("age Units do not say months")
          if not ("female" in lv.get("1", "") and "male" in lv.get("2", "") and "female" not in lv.get("2", "")):
              problems.append(f"sex Levels are not 1 = female, 2 = male: {lv}")
          if "hand" in d:
              problems.append("hand has an entry, but nothing describes it")
          for key, entry in d.items():
              if str(entry.get("Description", "")).strip().lower().replace("_", " ") == key.lower().replace("_", " "):
                  problems.append(f"{key}'s Description restates its name")
          sys.exit("; ".join(problems) or None)
          PY
      # The undescribed column, and the code the mapping misses, are named in the reply.
      - { kind: regex, target: final_text, pattern: '\bhand\b' }
      - { kind: regex, target: final_text, pattern: '\bpdd\b' }
      - kind: command
        run: git diff --quiet "$(git rev-list --max-parents=0 HEAD)" -- participants.tsv codebook.md

  - id: keep-existing-entries
    prompt: >
      participants.tsv has new columns since the last release. Update the data dictionary; the
      codebook for the new columns is codebook.md.
    split: val
    expect: { skill: gen-data-dict }
    rubric: rubric.yaml
    setup:
      - git init -q -b main .
      - 'printf ''participant_id\tage\tsite\tsex\tgrp\nsub-01\t412\tMTL\t1\thc\nsub-02\t530\tTOR\t2\tpd\nsub-03\t388\tMTL\t1\tpd\n'' > participants.tsv'
      # Written by someone with a codebook this run does not have; the skill must keep it verbatim.
      - 'printf ''{\n  "age": {"Description": "Age at the baseline visit, from the REDCap export", "Units": "months"},\n  "site": {"Description": "Acquisition site", "Levels": {"MTL": "Montreal Neurological Institute", "TOR": "Toronto Western"}}\n}\n'' > participants.json'
      - 'printf ''# Codebook for columns added in v3\n\n- sex: 1 = female, 2 = male\n- grp: hc = healthy control, pd = Parkinson disease\n'' > codebook.md'
      - git add -A && git commit -q -m "add table, dictionary and codebook"
    verifiers:
      - kind: command
        run: |
          python3 - <<'PY'
          import json, subprocess, sys
          first = subprocess.run(["git", "rev-list", "--max-parents=0", "HEAD"], capture_output=True, text=True).stdout.strip()
          before = json.loads(subprocess.run(["git", "show", f"{first}:participants.json"], capture_output=True, text=True).stdout)
          after = json.load(open("participants.json"))
          problems = [f"{k} changed" for k in before if after.get(k) != before[k]]
          problems += [f"{k} has no entry" for k in ("sex", "grp") if k not in after]
          sys.exit("; ".join(problems) or None)
          PY
      - kind: command
        run: git diff --quiet "$(git rev-list --max-parents=0 HEAD)" -- participants.tsv codebook.md

  - id: no-codebook
    prompt: >
      Document the variables in participants.tsv as a participants.json data dictionary.
    split: val
    expect: { skill: gen-data-dict }
    rubric: rubric.yaml
    setup:
      - git init -q -b main .
      - 'printf ''participant_id\tq7_r\tdx2\tsex\nsub-01\t3\tA\t0\nsub-02\t5\tB\t1\nsub-03\t2\tA\t1\n'' > participants.tsv'
      - git add -A && git commit -q -m "add table"
    verifiers:
      # With no source, no column may gain a meaning or a level coding. No file at all is fine.
      - kind: command
        run: |
          python3 - <<'PY'
          import json, os, sys
          if not os.path.exists("participants.json"):
              sys.exit(None)
          d = json.load(open("participants.json"))
          problems = []
          for key in ("q7_r", "dx2", "sex"):
              entry = d.get(key) or {}
              if str(entry.get("Description", "")).strip():
                  problems.append(f"{key} has a Description no one supplied")
              if any(str(v).strip() for v in (entry.get("Levels") or {}).values()):
                  problems.append(f"{key} has a level coding no one supplied")
          sys.exit("; ".join(problems) or None)
          PY
      - { kind: regex, target: final_text, pattern: '\bq7_r\b' }
      - { kind: regex, target: final_text, pattern: '\bdx2\b' }
      - { kind: command, run: "git diff --quiet \"$(git rev-list --max-parents=0 HEAD)\" -- participants.tsv" }

  - id: meanings-in-request
    prompt: >
      Make participants.json for participants.tsv. age is age at consent in years, sex is coded
      0 = male and 1 = female, and site is the scanning site, either MTL or TOR.
    split: val
    expect: { skill: gen-data-dict }
    rubric: rubric.yaml
    setup:
      - git init -q -b main .
      - 'printf ''participant_id\tage\tsex\tsite\nsub-01\t34\t0\tMTL\nsub-02\t29\t1\tTOR\nsub-03\t41\t1\tVAN\n'' > participants.tsv'
      - git add -A && git commit -q -m "add table"
    verifiers:
      - kind: command
        run: |
          python3 - <<'PY'
          import json, sys
          d = json.load(open("participants.json"))
          lv = {k: str(v).lower() for k, v in (d.get("sex", {}).get("Levels") or {}).items()}
          problems = []
          if "year" not in str(d.get("age", {}).get("Units", "")).lower():
              problems.append("age Units do not say years")
          if not ("female" not in lv.get("0", "female") and "male" in lv.get("0", "") and "female" in lv.get("1", "")):
              problems.append(f"sex Levels are not 0 = male, 1 = female: {lv}")
          sys.exit("; ".join(problems) or None)
          PY
      # VAN occurs in the data but not in the mapping the user gave: a finding, not a silent drop.
      - { kind: regex, target: final_text, pattern: '\bVAN\b' }
      - { kind: command, run: "git diff --quiet \"$(git rev-list --max-parents=0 HEAD)\" -- participants.tsv" }
