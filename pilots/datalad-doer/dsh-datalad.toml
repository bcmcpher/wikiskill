# One unit of data-science-harness: the datalad doer and the datalad-cli toolbox it consults.
#
# The first unit taken through the whole loop (add-minimal-loop). A collection is loaded by name,
# so copy this to ${XDG_CONFIG_HOME:-~/.config}/wikiskill/collections/dsh-datalad.toml, then:
#
#     wikiskill collection check dsh-datalad
#     wikiskill build --collection dsh-datalad --harness opencode --out /tmp/dsh-datalad

name = "dsh-datalad"

sources = [
  { path = "~/Projects/claude/data-science-harness/plugins", layout = "claude-plugin", plugins = ["datalad", "datalad-cli"] },
]

[watch]
agents = ["datalad/datalad-doer"]

# The judge must never be a model under test, so it stays on a small local model.
[roles.judge]
base_url = "http://localhost:11434/v1"
model = "gemma2:2b"

# The maintainer and proposer read long evidence and must reply in a strict JSON contract, which a
# 1.7B model at a 4k context does not manage. With no `base_url`, a role is asked through the
# harness, which is the only way `opencode/big-pickle` answers.
[roles.maintainer]
model = "opencode/big-pickle"

[roles.proposer]
model = "opencode/big-pickle"

[targets]
opencode = ["opencode/big-pickle"]

[aliases.opencode]
small = "opencode/big-pickle"
large = "opencode/big-pickle"
haiku = "small"
sonnet = "large"
opus = "large"
