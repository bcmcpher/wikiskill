# A model catalogue: what wikiskill is told about each model, since it never guesses a family from a
# name. Used by `wikiskill leaderboard --models-file` and `wikiskill report --models-file` to group
# rows by family, order them by size, and mark a judge that shares a family with the model it
# judges. A key names a model with or without its provider.
#
# These are the models served on the DSH pilot's GB10. Sizes are billions of parameters, from
# `ollama show` where it was run and from the Ollama library otherwise.

