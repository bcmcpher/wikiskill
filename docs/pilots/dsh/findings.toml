# The DSH pilot as a study: its runs are bundled under runs/, and every table, figure and data file
# is regenerated from them with `wikiskill findings tables` and `bin/figures`. See README "Studies".
#
# Not recorded, by decision: archive on gemma4:31b at --thinking default (run
# 01M4A6FZ6JXYSFG4AJXA78XJCK): 12 of 36 units hit the suite's 600 s per-unit timeout (infra_error),
# so the sweep left the run incomplete. It is not rerun with a larger budget, to keep every model
# under the same timeout_s; gemma4:31b with thinking on is reported as exceeding 600 s on those
# tasks. A later sweep.sh invocation would retry it.

[study]
name = "dsh-pilot"
collection = "dsh-archive"
models_file = "../../../pilots/models.toml"

[[tables]]
name = "sweep"
kind = "leaderboard"
roles = ["sweep"]

