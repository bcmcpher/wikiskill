# The DSH pilot's sweep of the BIDS doer as a study: `pilots/dsh-sweep/sweep.sh` adds each complete run
# here with role `sweep`. See README "Studies".
#
# Not recorded, by decision: bids on gemma4:31b at --thinking default (run
# 01M4AH76KFY826GV38T6A5Q68M): 5 units hit the suite's 600 s per-unit timeout (infra_error), so the
# sweep left the run incomplete. It is not rerun with a larger budget, to keep every model under the
# same timeout_s; gemma4:31b with thinking on is reported as exceeding 600 s on those tasks. A later
# sweep.sh invocation would retry it.

